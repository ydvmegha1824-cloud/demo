.wa{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--wa);color:#fff;font-size:16px;font-weight:bold;font-family:inherit}

</style></head><body>

const D=R.map(([t,l,s])=>({t,l:l?l.split(","):[],items:s.split(";").map(x=>{const[n,p,lb]=x.split("|");return{n,p:p.split("/").map(Number),l:lb?lb.split(","):null}})}));
const cart={};const $=s=>document.querySelector(s);
function info(k){const[c,i,v]=k.split(".").map(Number),it=D[c].items[i];return{n:it.n,lab:it.p.length>1?(it.l||D[c].l)[v]:"",pr:it.p[v]}}
function render(){const f=$("#q").value.trim().toLowerCase();let h="";
D.forEach((c,ci)=>{let r="";c.items.forEach((it,ii)=>{if(f&&!it.n.toLowerCase().includes(f))return;
r+=`<div class="it"><div class="n">${it.n}</div><div class="o">`+it.p.map((p,v)=>{const k=ci+"."+ii+"."+v,q=cart[k]||0,lb=it.p.length>1?(it.l||c.l)[v]:"";
return`<button data-k="${k}" class="${q?"on":""}">${lb?"<small>"+lb+"</small>":""}₹${p}${q?"<b>"+q+"</b>":""}</button>`}).join("")+`</div></div>`});
if(r)h+=`<section id="c${ci}"><h2>${c.t}</h2>${r}</section>`});
$("#m").innerHTML=h||'<p class="ft">No dishes found.</p>'}
$("#ch").innerHTML=D.map((c,i)=>`<button data-c="${i}">${c.t}</button>`).join("");
$("#ch").onclick=e=>{const b=e.target.closest("button");if(!b)return;const el=document.getElementById("c"+b.dataset.c);if(el)el.scrollIntoView({behavior:"smooth"})};
$("#q").oninput=render;
$("#m").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;cart[k]=(cart[k]||0)+1;upd()};
function tot(){let n=0,s=0;for(const k in cart){n+=cart[k];s+=cart[k]*info(k).pr}return[n,s]}
function upd(){const[n,s]=tot();$("#bar").style.display=n?"flex":"none";$("#bt").textContent=n+" item"+(n>1?"s":"")+" · ₹"+s;render();if($("#sh").style.display==="flex")cartHtml()}
function cartHtml(){const[n,s]=tot();if(!n){closeCart();return}
$("#cl").innerHTML=Object.keys(cart).map(k=>{const i=info(k);return`<div class="ln"><span>${i.n}${i.lab?" ("+i.lab+")":""}<br><small>₹${i.pr}</small></span><span class="st"><button onclick="ch('${k}',-1)">−</button><span>${cart[k]}</span><button onclick="ch('${k}',1)">+</button></span></div>`}).join("");
$("#tt").textContent="Total: ₹"+s+" (taxes extra)"}
function ch(k,d){cart[k]+=d;if(cart[k]<=0)delete cart[k];upd()}
function openCart(){$("#sh").style.display="flex";cartHtml()}
function closeCart(){$("#sh").style.display="none"}
function send(){const[n,s]=tot();if(!n)return;
let m="*New Order – Seezen*\n";if($("#nm").value)m+="Name: "+$("#nm").value+"\n";if($("#tb").value)m+="Table/Address: "+$("#tb").value+"\n";m+="\n";
Object.keys(cart).forEach(k=>{const i=info(k);m+=cart[k]+" x "+i.n+(i.lab?" ("+i.lab+")":"")+" – ₹"+cart[k]*i.pr+"\n"});
m+="\n*Total: ₹"+s+"* (taxes extra)";if($("#nt").value)m+="\nNote: "+$("#nt").value;
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m),"_blank")}
render();
